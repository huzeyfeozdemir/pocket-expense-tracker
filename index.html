<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cep Bütçe</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1b6b4a">
</head>
<body>
  <!-- Each screen is a <section>. Only one is visible at a time (see app.js → show()). -->
  <main id="app">
    <section id="screen-home" class="screen"></section>
    <section id="screen-list" class="screen" hidden></section>
    <section id="screen-upload" class="screen" hidden></section>
    <section id="screen-review" class="screen" hidden></section>
    <div id="loading" class="loading">Yükleniyor…</div>
  </main>

  <!-- Bottom menu -->
  <nav class="tabbar">
    <button data-screen="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Ana sayfa</span>
    </button>
    <button data-screen="list">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>İşlemler</span>
    </button>
    <button data-screen="upload">
      <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0l-5 5m5-5l5 5M4 20h16"/></svg>
      <span>Yükle</span>
    </button>
    <button data-screen="review">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <span>İncele</span>
      <b class="badge" id="review-badge" hidden></b>
    </button>
  </nav>

  <!-- Pop-up panel that slides up from the bottom (category picker, cash entry, confirmations) -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" hidden></div>

  <!-- Short messages ("3 işlem eklendi") -->
  <div id="toast" class="toast" hidden></div>

  <!-- Libraries: SQLite (sql.js) and PDF reader (pdf.js) -->
  <script src="lib/sql-wasm.js"></script>
  <script src="lib/pdf.min.js"></script>
  <!-- Our code -->
  <script src="js/parsers.js?v=2"></script>
  <script src="js/db.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script>
    // Register the service worker so the phone can install the app (and open it offline)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
